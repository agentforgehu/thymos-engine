[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thymos-engine"
version = "0.1.2"
description = "Thymos (心潮): a local-first, inspectable engine coupling forgetting curves, appraisal-based affect, endocrine modulation and real-world environment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thymos contributors" }]
keywords = [
  "affective-computing",
  "memory",
  "forgetting-curve",
  "emotion",
  "agent",
  "simulation",
  "fsrs",
  "act-r",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "numpy>=1.24", "matplotlib>=3.7", "build>=1.0"]

[project.urls]
Homepage = "https://github.com/agentforgehu/thymos-engine"
Repository = "https://github.com/agentforgehu/thymos-engine"
Issues = "https://github.com/agentforgehu/thymos-engine/issues"
Documentation = "https://github.com/agentforgehu/thymos-engine/tree/main/docs"

[project.scripts]
thymos = "thymos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thymos = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
