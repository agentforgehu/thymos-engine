name: Bug report
description: 报告可复现的错误
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认不是“参数选择”问题；如果是模型/参数讨论，请用“Model or parameter discussion”模板。
        不要粘贴真实用户的私密记忆、日记或位置。
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 最小可复现命令或代码
      placeholder: |
        1. python -m thymos --offline demo
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 包含 traceback / 日志（脱敏）
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / commit
      placeholder: "0.1.0 或 commit hash"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: "Windows 11 / Python 3.12 / 安装方式"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除真实用户数据、密钥与位置信息
          required: true
